colang_version: "1.0"

passthrough: true

models:
  - type: content_safety
    engine: openai
    model: gpt-5.4-nano
    api_key_env_var: OPENAI_API_KEY

  - type: topic_control
    engine: openai
    model: gpt-5.4-nano
    api_key_env_var: OPENAI_API_KEY

rails:
  config:
    content_safety:
      reasoning:
        enabled: true
  input:
    flows:
      - content safety check input $model=content_safety
      - topic safety check input $model=topic_control
  output:
    flows:
      - content safety check output $model=content_safety
